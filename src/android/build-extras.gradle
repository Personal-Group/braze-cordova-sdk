repositories {
    google()
    mavenCentral()
}

dependencies {
    def braze_sdk_version = "39.0.0"
    implementation "com.braze:android-sdk-ui:${braze_sdk_version}"
    implementation "com.braze:android-sdk-location:${braze_sdk_version}"
    implementation 'com.google.firebase:firebase-messaging:23.0.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.3.4'
    }
}

// apply the google services plugin by its class name since we're not
// in the root gradle file
ext.postBuildExtras = {
    apply plugin: com.google.gms.googleservices.GoogleServicesPlugin

    android {
        kotlinOptions {
            freeCompilerArgs = ['-Xjvm-default=all']
            jvmTarget = "11"
        }
    }
}


cdvPluginPostBuildExtras.add({
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"

            force "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.6.3"
            force "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.6.3"
        }
    }
})
